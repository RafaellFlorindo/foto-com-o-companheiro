<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Finalizar compra — Foto com o Companheiro</title>

<link rel="icon" type="image/png" href="https://rafaellflorindo.github.io/foto-com-o-companheiro/0928cc08-c912-473a-aac0-883c45aa91c1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --vermelho-escuro: #4a0505;
    --vermelho-escuro-2: #5c0808;
    --vermelho-vivo: #d81313;
    --dourado: #ffc93c;
    --dourado-2: #ffe08a;
    --preto: #1a0505;
    --branco: #fff8ec;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:'Manrope', -apple-system, sans-serif;
    background: linear-gradient(180deg, var(--vermelho-escuro) 0%, var(--vermelho-escuro-2) 55%, var(--preto) 100%);
    color: var(--branco);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 32px 16px 80px;
  }
  .wrap{ width:100%; max-width:460px; }
  .logo{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Anton', sans-serif; font-size:22px; letter-spacing:0.5px;
    margin-bottom: 24px;
  }
  .logo img{ width:36px; height:36px; border-radius:8px; object-fit:cover; }
  .logo .dot{ color: var(--dourado); }
  .card{
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,201,60,0.25);
    border-radius: 18px;
    padding: 22px;
    backdrop-filter: blur(6px);
  }
  .order-summary{
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:16px; margin-bottom:18px;
    border-bottom: 1px dashed rgba(255,255,255,0.2);
  }
  .order-summary h1{ font-size:16px; font-weight:700; }
  .order-summary p{ font-size:12px; opacity:0.7; margin-top:2px; }
  .order-summary .price{ font-family:'Anton', sans-serif; font-size:24px; color: var(--dourado); }
  label{ display:block; font-size:13px; font-weight:600; margin: 14px 0 6px; }
  input{
    width:100%; padding:13px 14px; border-radius:10px;
    border:1px solid rgba(255,255,255,0.18);
    background: rgba(0,0,0,0.25); color: var(--branco); font-size:15px;
    font-family:inherit;
  }
  input::placeholder{ color: rgba(255,248,236,0.4); }
  input:focus{ outline:2px solid var(--dourado); outline-offset:1px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .upload-box{
    display:flex; align-items:center; justify-content:center;
    min-height: 140px;
    border: 2px dashed rgba(255,255,255,0.25);
    border-radius: 14px;
    background: rgba(0,0,0,0.2);
    cursor:pointer;
    overflow:hidden;
    margin-top: 10px;
    transition: border-color .15s;
  }
  .upload-box:hover{ border-color: rgba(255,201,60,0.5); }
  .upload-box.has-file{ border-style:solid; border-color: var(--dourado); }
  .upload-empty{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:22px; text-align:center; font-size:13px; font-weight:700;
    color: rgba(255,248,236,0.6);
  }
  .upload-empty svg{ width:26px; height:26px; color: var(--dourado); }
  .upload-preview{ display:none; width:100%; max-height:260px; object-fit:cover; }
  .upload-box.has-file .upload-empty{ display:none; }
  .upload-box.has-file .upload-preview{ display:block; }
  .pix-badge{
    display:flex; align-items:center; gap:8px; justify-content:center;
    margin-top: 14px; padding:12px; border-radius:12px;
    border:2px solid var(--dourado); background: rgba(255,201,60,0.12);
    color: var(--dourado); font-size:13px; font-weight:800;
  }
  .pix-badge svg{ width:20px; height:20px; }
  .pay-btn{
    width:100%; margin-top:20px; padding:17px; border:none; border-radius:12px;
    background: linear-gradient(180deg, var(--dourado-2) 0%, var(--dourado) 100%);
    color: var(--vermelho-escuro); font-size:16px; font-weight:800; letter-spacing:0.3px;
    cursor:pointer; box-shadow: 0 6px 0 #b8860b;
    transition: transform .1s ease;
  }
  .pay-btn:active{ transform: translateY(4px); box-shadow: 0 2px 0 #b8860b; }
  .pay-btn:disabled{ opacity:0.6; cursor:not-allowed; }
  .error-box{
    display:none; background: rgba(216,19,19,0.18); border:1px solid var(--vermelho-vivo);
    color:#ffd6d6; padding:12px 14px; border-radius:10px; font-size:13px; margin-top:14px;
  }
  .lock-note{ text-align:center; font-size:12px; opacity:0.6; margin-top:16px; }
  .result{ display:none; }
  .result.show{ display:block; }
  .form-view.hide{ display:none; }
  .result h2{ font-family:'Anton', sans-serif; font-size:20px; color: var(--dourado); margin-bottom:6px; text-align:center; }
  .result p.hint{ text-align:center; font-size:13px; opacity:0.75; margin-bottom:18px; }
  .qr-box{ background:#fff; border-radius:14px; padding:16px; display:flex; justify-content:center; margin-bottom:16px; }
  .qr-box img{ width:100%; max-width:220px; }
  .copy-field{ display:flex; gap:8px; }
  .copy-field input{ flex:1; font-size:12px; }
  .copy-field button{
    padding:0 16px; border-radius:10px; border:none; background: var(--dourado);
    color: var(--vermelho-escuro); font-weight:700; cursor:pointer; font-size:13px;
    text-decoration:none; display:flex; align-items:center; justify-content:center;
  }
  .whats-hint{
    margin-top:18px; padding:14px; border-radius:12px; background: rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12); font-size:13px; line-height:1.5;
    display:flex; gap:12px; align-items:flex-start;
  }
  .whats-hint a{ color: var(--dourado); font-weight:700; }
  .whats-hint .thumb{
    width:48px; height:48px; border-radius:10px; object-fit:cover;
    flex-shrink:0; border:2px solid var(--dourado);
  }
  .spinner{
    display:inline-block; width:16px; height:16px; border:2px solid rgba(74,5,5,0.3);
    border-top-color: var(--vermelho-escuro); border-radius:50%; animation: spin .7s linear infinite;
    vertical-align:middle; margin-right:8px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="https://rafaellflorindo.github.io/foto-com-o-companheiro/0928cc08-c912-473a-aac0-883c45aa91c1.png" alt=""> Foto com<span class="dot">.</span>Companheiro</div>

  <div class="card">
    <div class="order-summary">
      <div>
        <h1>Foto com companheiro</h1>
        <p>Montagem personalizada com IA</p>
      </div>
      <div class="price">R$ 13</div>
    </div>

    <form id="form-view" class="form-view">
      <label for="name">Nome completo</label>
      <input id="name" name="name" type="text" placeholder="Seu nome completo" autocomplete="name" required>

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="email" required>

      <div class="row2">
        <div>
          <label for="phone">Celular</label>
          <input id="phone" name="phone" type="tel" placeholder="(31) 99999-9999" autocomplete="tel" required>
        </div>
        <div>
          <label for="doc">CPF</label>
          <input id="doc" name="doc" type="text" placeholder="000.000.000-00" inputmode="numeric" required>
        </div>
      </div>

      <label for="photo">Sua foto</label>
      <p style="font-size:12px;opacity:.65;margin:-2px 0 8px;font-weight:500;">Envie uma foto sua de rosto — é a que vamos usar na montagem.</p>
      <label class="upload-box" id="upload-box" for="photo">
        <div class="upload-empty" id="upload-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          <span>Toque para escolher a foto</span>
        </div>
        <img class="upload-preview" id="upload-preview" alt="Prévia da sua foto">
      </label>
      <input type="file" id="photo" name="photo" accept="image/*" style="display:none" required>

      <div class="pix-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.2l7.1-.6z"/></svg>
        Pagamento via Pix
      </div>

      <button type="submit" class="pay-btn" id="pay-btn">Pagar com Pix</button>
      <div class="error-box" id="error-box"></div>
      <p class="lock-note">🔒 Pagamento processado com segurança pela Cakto</p>
    </form>

    <div class="result" id="result"></div>
  </div>
</div>

<script>
  const formView = document.getElementById('form-view');
  const result = document.getElementById('result');
  const errorBox = document.getElementById('error-box');
  const payBtn = document.getElementById('pay-btn');
  const photoInput = document.getElementById('photo');
  const uploadBox = document.getElementById('upload-box');
  const uploadPreview = document.getElementById('upload-preview');
  let selectedPhotoUrl = null;

  photoInput.addEventListener('change', () => {
    const file = photoInput.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      showError('Envie um arquivo de imagem (JPG ou PNG).');
      photoInput.value = '';
      return;
    }
    if (file.size > 15 * 1024 * 1024) {
      showError('A foto precisa ter até 15MB.');
      photoInput.value = '';
      return;
    }
    hideError();
    if (selectedPhotoUrl) URL.revokeObjectURL(selectedPhotoUrl);
    selectedPhotoUrl = URL.createObjectURL(file);
    uploadPreview.src = selectedPhotoUrl;
    uploadBox.classList.add('has-file');
  });

  function getFingerprint() {
    let fp = localStorage.getItem('fcc_fp');
    if (!fp) {
      fp = 'fp_' + crypto.randomUUID();
      localStorage.setItem('fcc_fp', fp);
    }
    return fp;
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }

  function hideError() {
    errorBox.style.display = 'none';
  }

  const WHATSAPP_NUMBER = '5531997900284';
  const whatsappUrl = (ref) => `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent('Oi! Acabei de pagar minha foto personalizada (pedido ' + ref + '). Vou te enviar minha foto agora!')}`;

  function renderPix(data) {
    const pix = data.pix || {};
    result.innerHTML = `
      <h2>Escaneie o QR Code</h2>
      <p class="hint">Abra o app do seu banco e pague com Pix</p>
      <div class="qr-box"><img src="${pix.qrCodeBase64 || ''}" alt="QR Code Pix"></div>
      <label>Ou copie o código</label>
      <div class="copy-field">
        <input type="text" readonly value="${pix.qrCode || ''}" id="pix-code">
        <button type="button" id="copy-btn">Copiar</button>
      </div>
      <div class="whats-hint">
        ${selectedPhotoUrl ? `<img class="thumb" src="${selectedPhotoUrl}" alt="Sua foto">` : ''}
        <span>Depois de pagar, chame a gente no <a href="${whatsappUrl(data.refId || data.id)}" target="_blank" rel="noopener noreferrer">WhatsApp</a> e envie esta mesma foto que você escolheu aqui.</span>
      </div>
    `;
    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(pix.qrCode || '');
      document.getElementById('copy-btn').textContent = 'Copiado!';
      setTimeout(() => { document.getElementById('copy-btn').textContent = 'Copiar'; }, 2000);
    });
  }

  formView.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const doc = document.getElementById('doc').value.trim();

    if (!name || !email || !phone || !doc) {
      showError('Preencha todos os campos para continuar.');
      return;
    }
    if (!photoInput.files[0]) {
      showError('Envie sua foto para continuar.');
      return;
    }

    payBtn.disabled = true;
    payBtn.innerHTML = '<span class="spinner"></span> Processando...';

    try {
      const res = await fetch('/api/create-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name, email, phone, docNumber: doc,
          fingerprint: getFingerprint(),
        }),
      });

      const data = await res.json();

      if (!res.ok) {
        const msg = data.error === 'invalid_document' ? 'CPF inválido. Confira e tente de novo.'
          : data.error === 'invalid_phone' ? 'Número de celular inválido.'
          : 'Não foi possível gerar o pagamento. Confira os dados e tente novamente.';
        showError(msg);
        payBtn.disabled = false;
        payBtn.innerHTML = 'Pagar com Pix';
        return;
      }

      formView.classList.add('hide');
      result.classList.add('show');
      renderPix(data);
    } catch (err) {
      showError('Erro de conexão. Tente novamente em instantes.');
      payBtn.disabled = false;
      payBtn.innerHTML = 'Pagar com Pix';
    }
  });
</script>
</body>
</html>
